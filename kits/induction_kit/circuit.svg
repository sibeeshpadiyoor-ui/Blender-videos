<text x="54" y="857" font-size="13" text-anchor="start" font-weight="normal" fill="#444">0.4 mm wire.</text>
<text x="54" y="874" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Multimeter on AC volts.</text>
<text x="54" y="891" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Ideal 24 V and 48 V; real lower.</text>
<rect x="308" y="544" width="256" height="370" rx="10" class="panel"/>
