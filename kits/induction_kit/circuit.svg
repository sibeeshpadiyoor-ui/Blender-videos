<text x="1166" y="268" font-size="14" text-anchor="start" font-weight="normal" fill="#222">6 V bulb, 0.3-0.5 A</text>
<text x="1166" y="287" font-size="14" text-anchor="start" font-weight="normal" fill="#222">mounted on the bobbin</text>
<text x="940" y="420" font-size="13" text-anchor="start" font-weight="normal" fill="#444">L2 slides on the core: brightest resting on L1,</text>
<text x="940" y="437" font-size="13" text-anchor="start" font-weight="normal" fill="#444">dimmer as it is raised.</text>
<text x="40" y="524" font-size="19" text-anchor="start" font-weight="bold" fill="#222">Swap these in place of L2</text>
<rect x="40" y="544" width="256" height="370" rx="10" class="panel"/>
<text x="54" y="572" font-size="15" text-anchor="start" font-weight="bold" fill="#222">A. Measuring coils</text>
