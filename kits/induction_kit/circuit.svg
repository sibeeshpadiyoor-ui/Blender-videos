<path d="M992,640 L992,620 L1056,620 L1056,688" class="w"/>
<circle cx="1056" cy="710" r="22" class="part"/>
<text x="1056" y="717" font-size="20" text-anchor="middle" font-weight="bold" fill="#222">G</text>
<path d="M1056,732 L1056,800 L992,800 L992,780" class="w"/>
<text x="892" y="712" font-size="12" text-anchor="start" font-weight="normal" fill="#222">1.5 V</text>
<text x="934" y="824" font-size="12" text-anchor="end" font-weight="normal" fill="#222">L1</text>
<text x="998" y="824" font-size="12" text-anchor="start" font-weight="normal" fill="#222">L4</text>
<text x="858" y="846" font-size="13" text-anchor="start" font-weight="normal" fill="#444">1.5 V D cell and tap key K replace</text>
<text x="858" y="863" font-size="13" text-anchor="start" font-weight="normal" fill="#444">the 24 V supply. Centre-zero</text>
<text x="858" y="880" font-size="13" text-anchor="start" font-weight="normal" fill="#444">galvanometer: kicks at ON and OFF.</text>
<rect x="1112" y="544" width="256" height="370" rx="10" class="panel"/>
<text x="1126" y="572" font-size="15" text-anchor="start" font-weight="bold" fill="#222">Notes</text>
<text x="1126" y="602" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Primary circuit is one series</text>
<text x="1126" y="620" font-size="13" text-anchor="start" font-weight="normal" fill="#444">loop: T1, F2, S1, TH, L1.</text>
<text x="1126" y="638" font-size="13" text-anchor="start" font-weight="normal" fill="#444"></text>
<text x="1126" y="656" font-size="13" text-anchor="start" font-weight="normal" fill="#444">S1 is momentary, so L1 is only</text>
<text x="1126" y="674" font-size="13" text-anchor="start" font-weight="normal" fill="#444">powered while it is pressed.</text>
<text x="1126" y="692" font-size="13" text-anchor="start" font-weight="normal" fill="#444"></text>
<text x="1126" y="710" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Secondaries have no electrical</text>
<text x="1126" y="728" font-size="13" text-anchor="start" font-weight="normal" fill="#444">connection to the supply; they</text>
<text x="1126" y="746" font-size="13" text-anchor="start" font-weight="normal" fill="#444">are linked only by the core.</text>
<text x="1126" y="764" font-size="13" text-anchor="start" font-weight="normal" fill="#444"></text>
<text x="1126" y="782" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Use only L1 as the primary.</text>
<text x="1126" y="800" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Never feed 24 V into L3 or L4.</text>
<text x="1126" y="818" font-size="13" text-anchor="start" font-weight="normal" fill="#444"></text>
<text x="1126" y="836" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Brown double line = iron core.</text>
<text x="1126" y="854" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Red circles = 4 mm sockets.</text>
</svg>