<text x="322" y="840" font-size="13" text-anchor="start" font-weight="normal" fill="#444">60-100 turns, 0.4 mm wire.</text>
<text x="322" y="857" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Two LEDs back to back.</text>
<text x="322" y="874" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Lights even held well above L1.</text>
<rect x="576" y="544" width="256" height="370" rx="10" class="panel"/>
<text x="590" y="572" font-size="15" text-anchor="start" font-weight="bold" fill="#222">C. Jumping ring</text>
<path d="M700,595 L700,805" class="core"/>
<path d="M708,595 L708,805" class="core"/>
<path d="M649,668 a55,15 0 0 0 110,0" class="ring"/>
<path d="M649,758 a55,15 0 0 0 46,14" class="ring"/>
<path d="M715,772 a55,15 0 0 0 44,-14" class="ring"/>
<text x="772" y="664" font-size="13" text-anchor="start" font-weight="normal" fill="#222">whole</text>
<text x="772" y="754" font-size="13" text-anchor="start" font-weight="normal" fill="#222">split</text>
<text x="590" y="840" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Aluminium ring = one shorted turn.</text>
<text x="590" y="857" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Induced current repels it from L1.</text>
<text x="590" y="874" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Split ring: no current, no jump.</text>
<rect x="844" y="544" width="256" height="370" rx="10" class="panel"/>
<text x="858" y="572" font-size="15" text-anchor="start" font-weight="bold" fill="#222">D. Make and break (DC)</text>
